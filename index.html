<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Універсальний перетворювач кодів (Лаб 1-6)</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --term-bg: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 850px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        h2 {
            text-align: center;
            font-size: 1.1rem;
            color: #222;
        }

        .controls-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            width: 100%;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            width: auto;
        }

        .control-item label {
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .control-item input, .control-item select {
            padding: 7px 10px;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            max-width: 100%;
        }

        .btn-calc {
            padding: 9px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-calc:hover {
            background-color: #0056b3;
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        .btn-calc:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Анімована панель двійкового коду */
        .bits-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            width: 100%;
        }

        .bit-label {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1.3rem;
            font-weight: bold;
            color: #dc3545;
            width: 28px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border-radius: 6px;
            border: 1px solid #ddd;
            transition: color 0.4s ease, background-color 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
        }

        /* Клас активного (заповненого) біта з анімацією випливання */
        .bit-label.active {
            color: #28a745;
            border-color: #28a745;
            background-color: #eafaf1;
            animation: bitPop 0.35s ease-out;
        }

        @keyframes bitPop {
            0% {
                transform: scale(0.7);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 0.85rem;
        }

        .stats-table th, .stats-table td {
            border: 1px solid #ddd;
            padding: 6px 8px;
            text-align: left;
        }

        .stats-table th {
            background-color: #e9ecef;
        }

        .terminal-header {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .terminal {
            background-color: var(--term-bg);
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 10px;
            border-radius: 8px;
            height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
            width: 100%;
        }

        .tag-info { color: #569cd6; }
        .tag-success { color: #4ec9b0; }
        .tag-highlight { color: #ce9178; font-weight: bold; }
        .tag-gray { color: #dcdcaa; }
        .tag-error { color: #f44747; }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 10px; }
            .controls-group { flex-direction: column; align-items: stretch; }
            .control-item { flex-direction: column; align-items: stretch; width: 100%; }
            .control-item label { margin-bottom: 2px; }
            .control-item input, .control-item select { width: 100% !important; }
            .btn-calc { width: 100%; margin-top: 5px; }
            .bit-label { font-size: 1.1rem; width: 22px; height: 28px; }
            .terminal { font-size: 0.75rem; height: 220px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Перетворювач кодів (Лаб №1 - №6)</h2>

    <div class="controls-group">
        <div class="control-item">
            <label for="numInput">Число (0-1023):</label>
            <input type="number" id="numInput" min="0" max="1023" value="573">
        </div>

        <div class="control-item">
            <label for="modeSelect">Режим:</label>
            <select id="modeSelect" onchange="toggleErrorSelector()">
                <option value="all">Повний розрахунок (Лаб №1 - №6)</option>
                <option value="gray">Лаб №1: Код Грея & Декодування</option>
                <option value="bcd">Лаб №2: ДДК (BCD 8421) & Характеристики</option>
                <option value="parity">Лаб №3: Код з перевіркою на парність</option>
                <option value="inverse">Лаб №4: Інверсний код</option>
                <option value="corr">Лаб №5: Кореляційний код (Манчестер)</option>
                <option value="hamming">Лаб №6: Код Хеммінга (Виправлення помилок)</option>
            </select>
        </div>

        <div class="control-item" id="errorOptionBox" style="display: none;">
            <label for="errorBitSelect">Помилка в каналі:</label>
            <select id="errorBitSelect">
                <option value="-1">Без помилок</option>
                <option value="1">Спотворити біт 1 (p1)</option>
                <option value="3">Спотворити біт 3 (d1)</option>
                <option value="5" selected>Спотворити біт 5 (d2 - за завданням)</option>
                <option value="7">Спотворити біт 7 (d4)</option>
                <option value="10">Спотворити біт 10 (d6)</option>
                <option value="14">Спотворити біт 14 (d10)</option>
            </select>
        </div>

        <button id="btnConvert" class="btn-calc" onclick="startConversion()">Розрахувати</button>
    </div>

    <div class="bits-container" id="bitsBoard"></div>

    <div id="statsBox" style="display:none;">
        <div class="terminal-header" id="statsHeader">Основні характеристики коду:</div>
        <div class="table-wrapper">
            <table class="stats-table" id="statsTable"></table>
        </div>
    </div>

    <div>
        <div class="terminal-header">Термінал виконання:</div>
        <div class="terminal" id="terminal"></div>
    </div>
</div>

<script>
    const numInput = document.getElementById('numInput');
    const modeSelect = document.getElementById('modeSelect');
    const errorOptionBox = document.getElementById('errorOptionBox');
    const errorBitSelect = document.getElementById('errorBitSelect');
    const btnConvert = document.getElementById('btnConvert');
    const bitsBoard = document.getElementById('bitsBoard');
    const terminal = document.getElementById('terminal');
    const statsBox = document.getElementById('statsBox');
    const statsTable = document.getElementById('statsTable');
    const statsHeader = document.getElementById('statsHeader');

    let bitElements = [];

    function initBitsBoard() {
        bitsBoard.innerHTML = '';
        bitElements = [];
        for (let i = 0; i < 10; i++) {
            const span = document.createElement('span');
            span.className = 'bit-label';
            span.textContent = '0';
            bitsBoard.appendChild(span);
            bitElements.push(span);
        }
    }

    initBitsBoard();

    function toggleErrorSelector() {
        const mode = modeSelect.value;
        if (mode === 'parity' || mode === 'inverse' || mode === 'corr' || mode === 'hamming' || mode === 'all') {
            errorOptionBox.style.display = 'flex';
        } else {
            errorOptionBox.style.display = 'none';
        }
    }

    function logToTerminal(text, tagClass = '') {
        const div = document.createElement('div');
        if (tagClass) div.className = tagClass;
        div.textContent = text;
        terminal.appendChild(div);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function numToGray(n) {
        return n ^ (n >> 1);
    }

    function renderBcdStats(num) {
        const strNum = num.toString();
        const numDigits = strNum.length;
        const n = numDigits * 4;
        const totalN = Math.pow(2, n);
        const np = Math.pow(10, numDigits);
        const infoBits = Math.ceil(Math.log2(np));
        const r = n - infoBits;
        const relR = (1 - (Math.log2(np) / n)).toFixed(4);

        statsHeader.textContent = "Основні характеристики ДДК (8421) [За методичкою №2]:";
        statsTable.innerHTML = `
            <tr><th>Характеристика</th><th>Формула</th><th>Значення</th></tr>
            <tr><td>Основа коду</td><td><i>m</i></td><td>2 (двійковий)</td></tr>
            <tr><td>Довжина ДДК комбінації</td><td><i>n</i> = 4 × цифри</td><td>${n} біт</td></tr>
            <tr><td>Повне число комбінацій</td><td><i>N</i> = 2<sup><i>n</i></sup></td><td>${totalN}</td></tr>
            <tr><td>Потужність коду (робочі)</td><td><i>N</i><sub>p</sub> = 10<sup>цифри</sup></td><td>${np}</td></tr>
            <tr><td>Кількість перевірочних розрядів</td><td><i>r</i> = <i>n</i> - ⌈log<sub>2</sub> <i>N</i><sub>p</sub>⌉</td><td>${r} біт</td></tr>
            <tr><td>Відносна надлишковість</td><td><i>R</i> = 1 - (log<sub>2</sub> <i>N</i><sub>p</sub> / <i>n</i>)</td><td>${relR} (${(relR * 100).toFixed(2)}%)</td></tr>
        `;
        statsBox.style.display = 'block';
    }

    function renderParityStats(k = 10) {
        const r = 1;
        const n = k + r;
        const totalN = Math.pow(2, n);
        const np = Math.pow(2, k);
        const relR = (r / n).toFixed(4);

        statsHeader.textContent = "Основні характеристики коду з перевіркою на парність [За методичкою №3]:";
        statsTable.innerHTML = `
            <tr><th>Характеристика</th><th>Формула</th><th>Значення</th></tr>
            <tr><td>Інформаційних розрядів</td><td><i>k</i></td><td>${k} біт</td></tr>
            <tr><td>Перевірочних розрядів</td><td><i>r</i></td><td>${r} біт</td></tr>
            <tr><td>Загальна довжина коду</td><td><i>n</i> = <i>k</i> + <i>r</i></td><td>${n} біт</td></tr>
            <tr><td>Повне число комбінацій</td><td><i>N</i> = 2<sup><i>n</i></sup></td><td>${totalN}</td></tr>
            <tr><td>Потужність коду (робочі)</td><td><i>N</i><sub>p</sub> = 2<sup><i>k</i></sup></td><td>${np}</td></tr>
            <tr><td>Мінімальна кодова відстань</td><td><i>d</i></td><td>2 (виявляє 1-кратні)</td></tr>
            <tr><td>Надлишковість коду</td><td><i>R</i> = <i>r</i> / <i>n</i></td><td>${relR} (${(relR * 100).toFixed(2)}%)</td></tr>
        `;
        statsBox.style.display = 'block';
    }

    function renderInverseStats(k = 10) {
        const r = k;
        const n = k + r;
        const totalN = Math.pow(2, n);
        const np = Math.pow(2, k);

        statsHeader.textContent = "Основні характеристики Інверсного коду [За методичкою №4]:";
        statsTable.innerHTML = `
            <tr><th>Характеристика</th><th>Формула</th><th>Значення</th></tr>
            <tr><td>Інформаційних розрядів</td><td><i>k</i></td><td>${k} біт</td></tr>
            <tr><td>Перевірочних розрядів</td><td><i>r</i> = <i>k</i></td><td>${r} біт</td></tr>
            <tr><td>Загальна довжина коду</td><td><i>n</i> = 2<i>k</i></td><td>${n} біт</td></tr>
            <tr><td>Повне число комбінацій</td><td><i>N</i> = 2<sup><i>n</i></sup></td><td>${totalN}</td></tr>
            <tr><td>Потужність коду (робочі)</td><td><i>N</i><sub>p</sub> = 2<sup><i>k</i></sup></td><td>${np}</td></tr>
            <tr><td>Коефіцієнт надлишковості</td><td><i>R</i> = <i>r</i> / <i>n</i></td><td>0.5 (50.00%)</td></tr>
        `;
        statsBox.style.display = 'block';
    }

    function renderCorrStats(k = 10) {
        const r = k;
        const n = k + r;
        const totalN = Math.pow(2, n);
        const np = Math.pow(2, k);

        statsHeader.textContent = "Основні характеристики Кореляційного коду (Манчестер) [За методичкою №5]:";
        statsTable.innerHTML = `
            <tr><th>Характеристика</th><th>Формула</th><th>Значення</th></tr>
            <tr><td>Інформаційних розрядів</td><td><i>k</i></td><td>${k} біт</td></tr>
            <tr><td>Перевірочних розрядів</td><td><i>r</i> = <i>k</i></td><td>${r} біт</td></tr>
            <tr><td>Загальна довжина коду</td><td><i>n</i> = 2<i>k</i></td><td>${n} біт</td></tr>
            <tr><td>Повне число комбінацій</td><td><i>N</i> = 2<sup><i>n</i></sup></td><td>${totalN}</td></tr>
            <tr><td>Потужність коду (робочі)</td><td><i>N</i><sub>p</sub> = 2<sup><i>k</i></sup></td><td>${np}</td></tr>
            <tr><td>Надлишковість коду</td><td><i>R</i> = 1 - <i>k</i> / (2<i>k</i>)</td><td>0.5 (50.00%)</td></tr>
        `;
        statsBox.style.display = 'block';
    }

    function renderHammingStats(k = 10, r = 4) {
        const n = k + r;
        const totalN = Math.pow(2, n);
        const np = Math.pow(2, k);
        const relR = (r / n).toFixed(4);

        statsHeader.textContent = "Основні характеристики коду Хеммінга [За методичкою №6]:";
        statsTable.innerHTML = `
            <tr><th>Характеристика</th><th>Формула</th><th>Значення</th></tr>
            <tr><td>Інформаційних розрядів</td><td><i>k</i></td><td>${k} біт</td></tr>
            <tr><td>Перевірочних розрядів</td><td><i>r</i> (2<sup><i>r</i></sup> ≥ <i>k</i> + <i>r</i> + 1)</td><td>${r} біт (позиції 1, 2, 4, 8)</td></tr>
            <tr><td>Загальна довжина коду</td><td><i>n</i> = <i>k</i> + <i>r</i></td><td>${n} біт</td></tr>
            <tr><td>Повне число комбінацій</td><td><i>N</i> = 2<sup><i>n</i></sup></td><td>${totalN}</td></tr>
            <tr><td>Потужність коду (робочі)</td><td><i>N</i><sub>p</sub> = 2<sup><i>k</i></sup></td><td>${np}</td></tr>
            <tr><td>Мінімальна кодова відстань</td><td><i>d</i><sub>min</sub></td><td>3 (виправляє 1-кратні помилки)</td></tr>
            <tr><td>Надлишковість коду</td><td><i>R</i> = <i>r</i> / <i>n</i></td><td>${relR} (${(relR * 100).toFixed(2)}%)</td></tr>
        `;
        statsBox.style.display = 'block';
    }

    async function runGrayProcess(val, binStr) {
        const grayVal = numToGray(val);
        const grayStr = grayVal.toString(2).padStart(10, '0');

        logToTerminal("\n[ЛАБ №1] КОД ГРЕЯ ТА ЙОГО ДЕКОДУВАННЯ:", "tag-info");
        logToTerminal(`   Отриманий код Грея (G = B ⊕ (B >> 1)): ${grayStr}`, "tag-gray");
        logToTerminal("   Покрокове декодування в двійковий код (зліва направо):");

        let currentDecodedStr = "";
        for (let i = 0; i < grayStr.length; i++) {
            await sleep(120);
            let nextBit;
            if (i === 0) {
                nextBit = grayStr[0];
                logToTerminal(`   • Біт 0: B₀ = G₀ ➔ ${nextBit}`);
            } else {
                const prevB = parseInt(currentDecodedStr[i - 1]);
                const currG = parseInt(grayStr[i]);
                nextBit = (prevB ^ currG).toString();
                logToTerminal(`   • Біт ${i}: B_${i} = B_${i-1} ⊕ G_${i} ➔ ${prevB} ⊕ ${currG} = ${nextBit}`);
            }
            currentDecodedStr += nextBit;
        }

        const decodedVal = parseInt(currentDecodedStr, 2);
        logToTerminal(`   Результат декодування коду Грея:     ${currentDecodedStr} (Десятичне: ${decodedVal})`, "tag-success");
    }

    async function runBcdProcess(val, binStr) {
        logToTerminal("\n[ЛАБ №2] ДВІЙКОВО-ДЕСЯТКОВИЙ КОД (BCD 8421):", "tag-info");
        renderBcdStats(val);
        logToTerminal("   Правило: Якщо тетрада >= 5 (0101_2), додаємо +3 (0011_2) ПЕРЕД зсувом.", "tag-gray");

        let hundreds = 0, tens = 0, units = 0;

        for (let step = 0; step < 10; step++) {
            const currentBit = parseInt(binStr[step]);
            let corrected = false;

            if (hundreds >= 5) { hundreds += 3; corrected = true; }
            if (tens >= 5) { tens += 3; corrected = true; }
            if (units >= 5) { units += 3; corrected = true; }

            hundreds = (hundreds << 1) & 0xF;
            if ((tens & 0x8) >> 3) hundreds |= 1;

            tens = (tens << 1) & 0xF;
            if ((units & 0x8) >> 3) tens |= 1;

            units = (units << 1) & 0xF;
            if (currentBit) units |= 1;

            const hStr = hundreds.toString(2).padStart(4, '0');
            const tStr = tens.toString(2).padStart(4, '0');
            const uStr = units.toString(2).padStart(4, '0');

            let logStep = `   Крок ${step + 1}/10 (Біт: ${currentBit}): `;
            if (corrected) {
                logStep += `[Корекція +3] `;
            }
            logStep += `Сотні: [${hStr}] Десятки: [${tStr}] Одиниці: [${uStr}]`;

            logToTerminal(logStep);
            await sleep(150);
        }

        const bcdResult = `${hundreds.toString(2).padStart(4, '0')} ${tens.toString(2).padStart(4, '0')} ${units.toString(2).padStart(4, '0')}`;
        logToTerminal(`\n[РЕЗУЛЬТАТ] ДДК (BCD 8421) комбінація: ${bcdResult}`, "tag-success");
        logToTerminal(`[УСПІХ] Перевірка за десятковим значенням: ${hundreds}${tens}${units}`, "tag-highlight");
    }

    async function runParityProcess(val, binStr) {
        logToTerminal("\n[ЛАБ №3] КОД З ОДНІЄЮ ПЕРЕВІРКОЮ НА ПАРНІСТЬ:", "tag-info");
        renderParityStats(10);

        let onesCount = 0;
        for (let char of binStr) {
            if (char === '1') onesCount++;
        }

        const parityBit = onesCount % 2 === 0 ? 0 : 1;
        const fullCodeStr = binStr + parityBit;

        logToTerminal(`   1. Кодування на передавачі:`, "tag-gray");
        logToTerminal(`      Інформаційні біти (k=10): ${binStr} (Кількість одиниць: ${onesCount})`);
        logToTerminal(`      Обчислення біта парності p = b₀ ⊕ b₁ ⊕ ... ⊕ b₉ ➔ ${parityBit}`);
        logToTerminal(`      Передана комбінація (n=11): ${binStr}[${parityBit}]`, "tag-success");

        await sleep(200);

        const errorIndex = parseInt(errorBitSelect.value);
        let receivedCodeArr = fullCodeStr.split('');
        
        logToTerminal(`   2. Передача через канал зв'язку:`, "tag-gray");
        if (errorIndex >= 0 && errorIndex <= 10) {
            receivedCodeArr[errorIndex] = receivedCodeArr[errorIndex] === '0' ? '1' : '0';
            logToTerminal(`      [УВАГА] Введено штучну помилку у біт ${errorIndex}!`, "tag-error");
        } else {
            logToTerminal(`      Передача без спотворень (чистий канал).`, "tag-success");
        }

        const receivedCodeStr = receivedCodeArr.join('');
        const recBin = receivedCodeStr.substring(0, 10);
        const recParity = parseInt(receivedCodeStr.substring(10, 11));

        logToTerminal(`   3. Декодування та контроль на приймачі:`, "tag-gray");
        logToTerminal(`      Прийнята комбінація: ${recBin}[${recParity}]`);

        let recOnes = 0;
        for (let char of recBin) {
            if (char === '1') recOnes++;
        }
        const calcRecParity = recOnes % 2 === 0 ? 0 : 1;
        const syndrome = recParity ^ calcRecParity;

        logToTerminal(`      Обчислено p'' для прийнятих даних: ${calcRecParity}`);
        logToTerminal(`      Перевірка синдрому S = p' ⊕ p'' = ${recParity} ⊕ ${calcRecParity} = ${syndrome}`);

        if (syndrome === 0) {
            logToTerminal(`   [РЕЗУЛЬТАТ] S = 0 ➔ Помилок не виявлено (паритет збережено).`, "tag-success");
        } else {
            logToTerminal(`   [ПОМИЛКА] S = 1 ➔ Порушення парності! Виявлено спотворення в каналі!`, "tag-error");
        }
    }

    async function runInverseProcess(val, binStr) {
        logToTerminal("\n[ЛАБ №4] ІНВЕРСНИЙ КОД (ПОБУДОВА ТА ДЕКОДУВАННЯ):", "tag-info");
        renderInverseStats(10);

        let onesCount = 0;
        for (let char of binStr) {
            if (char === '1') onesCount++;
        }

        const isEven = (onesCount % 2 === 0);
        let checkPart = "";

        if (isEven) {
            checkPart = binStr;
        } else {
            for (let char of binStr) {
                checkPart += (char === '0' ? '1' : '0');
            }
        }

        logToTerminal(`   1. Кодування на передавачі:`, "tag-gray");
        logToTerminal(`      Інформаційні біти A (k=10): ${binStr} (Одиниць: ${onesCount} ➔ ${isEven ? 'ПАРНА' : 'НЕПАРНА'})`);
        logToTerminal(`      Правило: ${isEven ? 'Повторення (B = A)' : 'Інверсія (B = A ⊕ 1)'}`);
        logToTerminal(`      Перевірна частина B (r=10): ${checkPart}`);
        
        const fullInverseCode = binStr + checkPart;
        logToTerminal(`      Повний інверсний код (n=20): [${binStr}] [${checkPart}]`, "tag-success");

        await sleep(200);

        const errorIndex = parseInt(errorBitSelect.value);
        let recArr = fullInverseCode.split('');

        logToTerminal(`   2. Передача через канал зв'язку:`, "tag-gray");
        if (errorIndex >= 0 && errorIndex < 20) {
            recArr[errorIndex] = recArr[errorIndex] === '0' ? '1' : '0';
            logToTerminal(`      [УВАГА] Введено штучну помилку у біт ${errorIndex}!`, "tag-error");
        } else {
            logToTerminal(`      Передача без спотворень (чистий канал).`, "tag-success");
        }

        const recInfoPart = recArr.slice(0, 10).join('');
        const recCheckPart = recArr.slice(10, 20).join('');

        logToTerminal(`   3. Декодування та контроль на приймачі:`, "tag-gray");
        logToTerminal(`      Прийнята інформаційна частина A': ${recInfoPart}`);
        logToTerminal(`      Прийнята перевірна частина B':    ${recCheckPart}`);

        let recOnes = 0;
        for (let char of recInfoPart) {
            if (char === '1') recOnes++;
        }
        const recIsEven = (recOnes % 2 === 0);
        
        let expectedCheckPart = "";
        if (recIsEven) {
            expectedCheckPart = recInfoPart;
        } else {
            for (let char of recInfoPart) expectedCheckPart += (char === '0' ? '1' : '0');
        }

        logToTerminal(`      Очікувана перевірна частина B'':  ${expectedCheckPart}`);

        let errorFound = false;
        let syndromeStr = "";
        for (let i = 0; i < 10; i++) {
            const diff = (parseInt(recCheckPart[i]) ^ parseInt(expectedCheckPart[i]));
            syndromeStr += diff;
            if (diff !== 0) errorFound = true;
        }

        logToTerminal(`      Вектор синдрому S = B' ⊕ B'':     ${syndromeStr}`);

        if (!errorFound) {
            logToTerminal(`   [РЕЗУЛЬТАТ] S = 0 ➔ Помилок не виявлено (інверсний код коректний).`, "tag-success");
            logToTerminal(`   [ДЕКОДОВАНО] Прийняте число: ${parseInt(recInfoPart, 2)}`, "tag-highlight");
        } else {
            logToTerminal(`   [ПОМИЛКА] S ≠ 0 ➔ Виявлено спотворення даних в каналі!`, "tag-error");
        }
    }

    async function runCorrProcess(val, binStr) {
        logToTerminal("\n[ЛАБ №5] КОРЕЛЯЦІЙНИЙ КОД (МАНЧЕСТЕР):", "tag-info");
        renderCorrStats(10);

        let corrCodeArr = [];
        let logPairs = [];

        for (let i = 0; i < binStr.length; i++) {
            const bit = binStr[i];
            const pair = (bit === '0') ? "01" : "10";
            corrCodeArr.push(pair);
            logPairs.push(`${bit}➔${pair}`);
        }

        const fullCorrStr = corrCodeArr.join('');

        logToTerminal(`   1. Кодування на передавачі:`, "tag-gray");
        logToTerminal(`      Інформаційні біти (k=10): ${binStr}`);
        logToTerminal(`      Заміна за правилом (0➔01, 1➔10): ${logPairs.join(', ')}`);
        logToTerminal(`      Передана кореляційна послідовність (n=20): ${fullCorrStr}`, "tag-success");

        await sleep(200);

        const errorIndex = parseInt(errorBitSelect.value);
        let recArr = fullCorrStr.split('');

        logToTerminal(`   2. Передача через канал зв'язку:`, "tag-gray");
        if (errorIndex >= 0 && errorIndex < 20) {
            recArr[errorIndex] = recArr[errorIndex] === '0' ? '1' : '0';
            logToTerminal(`      [УВАГА] Введено штучну помилку у біт ${errorIndex}!`, "tag-error");
        } else {
            logToTerminal(`      Передача без спотворень (чистий канал).`, "tag-success");
        }

        const recCorrStr = recArr.join('');
        logToTerminal(`   3. Декодування та контроль по тактах на приймачі:`, "tag-gray");
        logToTerminal(`      Прийнята послідовність: ${recCorrStr}`);

        let decodedBin = "";
        let errorFound = false;

        for (let i = 0; i < 10; i++) {
            const pair = recCorrStr.substring(i * 2, i * 2 + 2);
            if (pair === "01") {
                decodedBin += "0";
            } else if (pair === "10") {
                decodedBin += "1";
            } else {
                decodedBin += "?";
                errorFound = true;
                logToTerminal(`      • Такт ${i + 1} [Пара ${pair}]: ЗАБОРОНЕНА КОМБІНАЦІЯ (Помилка!)`, "tag-error");
            }
        }

        if (!errorFound) {
            logToTerminal(`   [РЕЗУЛЬТАТ] Всі такти коректні ➔ Помилок не виявлено.`, "tag-success");
            logToTerminal(`   [ДЕКОДОВАНО] Прийнятий код: ${decodedBin} (Десятичне: ${parseInt(decodedBin, 2)})`, "tag-highlight");
        } else {
            logToTerminal(`   [ПОМИЛКА] Виявлено порушення структури Манчестерського коду у такті!`, "tag-error");
        }
    }

    async function runHammingProcess(val, binStr) {
        logToTerminal("\n[ЛАБ №6] КОД ХЕММІНГА (ВИПРАВЛЕННЯ ПОМИЛОК):", "tag-info");
        renderHammingStats(10, 4);

        let hCode = new Array(15).fill(0);
        const dataBits = binStr.split('').map(Number);

        const dataPositions = [3, 5, 6, 7, 9, 10, 11, 12, 13, 14];
        for (let i = 0; i < 10; i++) {
            hCode[dataPositions[i]] = dataBits[i];
        }

        hCode[1] = hCode[3] ^ hCode[5] ^ hCode[7] ^ hCode[9] ^ hCode[11] ^ hCode[13];
        hCode[2] = hCode[3] ^ hCode[6] ^ hCode[7] ^ hCode[10] ^ hCode[11] ^ hCode[14];
        hCode[4] = hCode[5] ^ hCode[6] ^ hCode[7] ^ hCode[12] ^ hCode[13] ^ hCode[14];
        hCode[8] = hCode[9] ^ hCode[10] ^ hCode[11] ^ hCode[12] ^ hCode[13] ^ hCode[14];

        const fullHammingStr = hCode.slice(1, 15).join('');

        logToTerminal(`   1. Кодування на передавачі (n=14, k=10, r=4):`, "tag-gray");
        logToTerminal(`      Інформаційні біти: ${binStr}`);
        logToTerminal(`      Розраховані контрольні біти: p1=${hCode[1]}, p2=${hCode[2]}, p4=${hCode[4]}, p8=${hCode[8]}`);
        logToTerminal(`      Переданий код Хеммінга (1..14): ${fullHammingStr}`, "tag-success");

        await sleep(200);

        const errorIndex = parseInt(errorBitSelect.value);
        let recHCode = [...hCode];

        logToTerminal(`   2. Передача через канал зв'язку:`, "tag-gray");
        if (errorIndex >= 1 && errorIndex <= 14) {
            recHCode[errorIndex] = recHCode[errorIndex] === 0 ? 1 : 0;
            logToTerminal(`      [УВАГА] Введено штучну помилку в біт на позиції ${errorIndex}!`, "tag-error");
        } else {
            logToTerminal(`      Передача без спотворень (чистий канал).`, "tag-success");
        }

        logToTerminal(`   3. Декодування та обчислення синдрому на приймачі:`, "tag-gray");
        logToTerminal(`      Прийнятий вектор (1..14): ${recHCode.slice(1, 15).join('')}`);

        const s1 = recHCode[1] ^ recHCode[3] ^ recHCode[5] ^ recHCode[7] ^ recHCode[9] ^ recHCode[11] ^ recHCode[13];
        const s2 = recHCode[2] ^ recHCode[3] ^ recHCode[6] ^ recHCode[7] ^ recHCode[10] ^ recHCode[11] ^ recHCode[14];
        const s4 = recHCode[4] ^ recHCode[5] ^ recHCode[6] ^ recHCode[7] ^ recHCode[12] ^ recHCode[13] ^ recHCode[14];
        const s8 = recHCode[8] ^ recHCode[9] ^ recHCode[10] ^ recHCode[11] ^ recHCode[12] ^ recHCode[13] ^ recHCode[14];

        const syndromeVal = (s8 << 3) | (s4 << 2) | (s2 << 1) | s1;
        logToTerminal(`      Вектор синдрому (s8 s4 s2 s1): (${s8} ${s4} ${s2} ${s1})_2 ➔ Синдром S = ${syndromeVal}`);

        if (syndromeVal === 0) {
            logToTerminal(`   [РЕЗУЛЬТАТ] S = 0 ➔ Помилок не виявлено!`, "tag-success");
        } else {
            logToTerminal(`   [ПОМИЛКА ВИЯВЛЕНА] Синдром S = ${syndromeVal} вказує на спотворення біта №${syndromeVal}!`, "tag-error");
            logToTerminal(`   [АВТО-ВИПРАВЛЕННЯ] Інвертуємо біт №${syndromeVal}: ${recHCode[syndromeVal]} ➔ ${recHCode[syndromeVal] ^ 1}`, "tag-highlight");
            recHCode[syndromeVal] ^= 1;
        }

        let recoveredDataBits = [];
        for (let pos of dataPositions) {
            recoveredDataBits.push(recHCode[pos]);
        }
        const recoveredBinStr = recoveredDataBits.join('');
        const recoveredVal = parseInt(recoveredBinStr, 2);

        logToTerminal(`   [ВІДНОВЛЕНО] Інформаційні біти: ${recoveredBinStr} (Десятичне: ${recoveredVal})`, "tag-success");
    }

    async function startConversion() {
        const val = parseInt(numInput.value);
        const mode = modeSelect.value;

        if (isNaN(val) || val < 0 || val > 1023) {
            logToTerminal("[ПОМИЛКА] Введіть число від 0 до 1023!", "tag-error");
            return;
        }

        btnConvert.disabled = true;
        statsBox.style.display = 'none';

        bitElements.forEach(el => {
            el.textContent = '0';
            el.classList.remove('active');
        });

        const binStr = val.toString(2).padStart(10, '0');

        logToTerminal("\n==================================================", "tag-info");
        logToTerminal(`--- РОЗРАХУНОК ДЛЯ ЧИСЛА: ${val} (РЕЖИМ: ${modeSelect.options[modeSelect.selectedIndex].text}) ---`, "tag-highlight");
        
        logToTerminal("[1] Прямий двійковий код (10 біт):", "tag-info");
        
        // Плавна та красиво затримана анімація появи двійкових бітів (по 300 мс на біт)
        for (let i = 0; i < 10; i++) {
            await sleep(300);
            bitElements[i].textContent = binStr[i];
            bitElements[i].classList.add('active');
        }
        logToTerminal(`   Результат: ${binStr}`, "tag-success");

        if (mode === 'gray' || mode === 'all') await runGrayProcess(val, binStr);
        if (mode === 'bcd' || mode === 'all') await runBcdProcess(val, binStr);
        if (mode === 'parity' || mode === 'all') await runParityProcess(val, binStr);
        if (mode === 'inverse' || mode === 'all') await runInverseProcess(val, binStr);
        if (mode === 'corr' || mode === 'all') await runCorrProcess(val, binStr);
        if (mode === 'hamming' || mode === 'all') await runHammingProcess(val, binStr);

        btnConvert.disabled = false;
    }
</script>
